name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: read
  id-token: write

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      project_type: 'worker'
      install_command: 'npm install'
      typecheck_command: 'npx tsc --noEmit'
      # @ippoan/mcp-cf-workers (GitHub Packages) を install するための
      # registry + NODE_AUTH_TOKEN セットアップ (ci-dashboard#118 と同じ理由)
      npm_scope: '@ippoan'
      # staging (`gmail-mcp-staging` + gmail-mcp.ippoan.org) が実稼働 env。
      # ci-dashboard と同じ staging=prod パターン
      deploy_staging_script: 'npx wrangler deploy --env staging'
      deploy_release_script: 'npx wrangler deploy'
    secrets: inherit
