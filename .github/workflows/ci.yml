name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: read
  id-token: write

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      project_type: 'worker'
      install_command: 'npm install'
      typecheck_command: 'npx tsc --noEmit'
      # @ippoan/mcp-cf-workers (GitHub Packages) を install するための
      # registry + NODE_AUTH_TOKEN セットアップ (ci-dashboard#118 と同じ理由)
      npm_scope: '@ippoan'
      # Worker 実体（wrangler.toml / entry point）がまだ無い。
      # deploy は Issue #1 の createWorkerMcp スケルトンが入る PR で有効化する
      has_deploy: false
    secrets: inherit
